[constants]
target_triple = 'arm64-apple-macos'

[binaries]
c = ['clang', '-target', target_triple]
cpp = ['clang++', '-target', target_triple]
ar = 'llvm-ar'
strip = 'llvm-strip'

[built-in options]
c_args = ['-mcpu=cortex-a53']
cpp_args = ['-mcpu=cortex-a53']

[properties]
target_triple = target_triple

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
